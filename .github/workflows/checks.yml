name: Offline application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified official tag
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 dereferenced commit
        with:
          version: "0.10.2"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --frozen --python "$(python -c 'import sys; print(sys.executable)')"
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=moderate
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Backend, recovery, security and data regressions (no providers)
        run: |
          uv run --frozen pytest -q
          uv run --frozen ruff check backend tests deploy scripts/prepare_artwork.py scripts/verify_design.py scripts/probe_delivery_sources.py scripts/prepare_layout.py scripts/verify_market_flow.py scripts/probe_market_sources.py
      - name: Frontend unit, format and artifact verification
        run: |
          npm run test --prefix frontend
          npm run format:check --prefix frontend
          uv run --frozen python scripts/verify_design.py
          node deploy/check_frontend.mjs
      - name: Assembled production API boundary
        run: |
          sh deploy/build_api.sh
          .delivery/api/.venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('PIL') is None; assert importlib.util.find_spec('pytest') is None"
      - name: Production frontend build with non-deployed test domains
        env:
          VITE_API_BASE_URL: https://api.example.org
          FRONTEND_ORIGIN: https://dashboard.example.org
          COOKIE_SITE_DOMAIN: example.org
        run: |
          node deploy/build_frontend.mjs
          node deploy/check_artifact.mjs
      - name: Compiled browser regressions (fixture server only)
        run: |
          VITE_API_BASE_URL=http://localhost:8001 npm run build --prefix frontend -- --outDir ../.verification/browser-dist --emptyOutDir
          E2E_PREVIEW=1 npm run test:browser --prefix frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: fixture-browser-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
