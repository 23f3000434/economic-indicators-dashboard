# Zero-budget reference blueprint for a NEW deployment. Existing manually created
# database dpg-db8vao67bikc73bdm49g-a must be linked, not recreated by syncing this.
services:
  - type: web
    name: economic-indicators-api
    runtime: python
    plan: free
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: sh deploy/build_api.sh
    startCommand: sh deploy/start_api.sh
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: UV_VERSION
        value: 0.10.2
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: economic-indicators-db
          property: connectionString
      - key: AUTH_COOKIE_MODE
        value: frontend_proxy
      - key: API_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: BOOTSTRAP_USERNAME
        sync: false
      - key: BOOTSTRAP_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ROTATION_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE_SECONDS
        value: "604800"
      - key: COLLECTOR_ENABLED
        value: "true"
databases:
  - name: economic-indicators-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
